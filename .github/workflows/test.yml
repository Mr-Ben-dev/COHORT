name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # The designer privacy test starts `next start` against web/.next, so the
      # UI has to be installed and built before the suite runs.
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm test
      - run: npm run build
