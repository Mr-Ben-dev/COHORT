name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Compact 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Pin Compact compiler 0.31.1
        run: |
          export PATH="$HOME/.local/bin:$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          compact compile +0.31.1 --version
      - run: npm ci
      # Playwright privacy tests start `next start` against web/.next.
      - run: npm install
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Full Compact compile (not --skip-zk)
        # Full ZK keygen for all circuits is slow; the generous timeout is deliberate.
        timeout-minutes: 60
        run: npm run compile
      - name: Test suite
        timeout-minutes: 45
        run: npm test
      - name: Judge verification
        # --skip-compile/--skip-tests: compile and the full suite already ran as
        # dedicated steps above; re-running inside judge-verify would double the
        # work and hit its own 180s self-test spawn timeout. Pins and committed
        # evidence are still verified here.
        run: npm run judge:verify -- --skip-compile --skip-tests
      - run: npm run build
