# render.yaml - COHORT Render blueprint.
#
# KEEP-ALIVE: Render's free plan has no native cron jobs, so warm-up is external.
# scripts/keepalive.mjs pings the health endpoint below plus the Vercel
# frontend every 10 minutes (see docs/keepalive.md for the three supported
# scheduling options). Both probes are unauthenticated GETs and the script
# always exits 0 (failures are logged, never fatal).

services:
  - type: web
    name: cohort
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:dapp
    startCommand: npm run build:dapp && node apps/api/src/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MIDNIGHT_NETWORK
        value: preprod
      - key: MIDNIGHT_INDEXER_URL
        value: https://midnight-preprod.blockfrost.io/api/v0
      - key: MIDNIGHT_INDEXER_WS_URL
        value: wss://midnight-preprod.blockfrost.io/api/v0/ws
      - key: MIDNIGHT_NODE_URL
        value: https://rpc.midnight-preprod.blockfrost.io
      - key: BLOCKFROST_PROJECT_ID
        sync: false
      - key: COHORT_CONTRACT_ADDRESS
        value: "1d5c2084222c8abea80bc8228c0c743ca183138e52f404594caa28572e7c29cc"
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
